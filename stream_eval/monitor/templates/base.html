<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>stream-eval dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-poll-active-ms="{{ poll_active_ms | default(5000) }}"
      data-poll-idle-ms="{{ poll_idle_ms | default(30000) }}">
  <header>
    <h1>stream-eval</h1>
    {% if session %}<div class="session">session: {{ session }}</div>{% endif %}
    <div class="poll-controls">
      <label class="poll-tune" title="Poll interval (ms) when active runs exist">
        active
        <input id="poll-active-input" type="number" min="100" step="100"
               value="{{ poll_active_ms | default(5000) }}">
      </label>
      <label class="poll-tune" title="Poll interval (ms) when no active runs">
        idle
        <input id="poll-idle-input" type="number" min="100" step="500"
               value="{{ poll_idle_ms | default(30000) }}">
      </label>
      <button id="refresh-now" type="button">refresh now</button>
      <span id="poll-status">polling</span>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    /* Persist <details data-persist-key> open/closed state across
       re-renders. Each refresh wholesale-replaces <main>, which
       resets every <details> to its template default -- without
       this, expanded "Active workers" / "Recent completions" blocks
       collapse on every poll cycle. localStorage keeps the user's
       choice durable. */
    const DETAILS_STORAGE_PREFIX = "stream-eval-details:";
    function applyPersistedDetails() {
      document.querySelectorAll("details[data-persist-key]").forEach((el) => {
        const key = DETAILS_STORAGE_PREFIX + el.dataset.persistKey;
        const stored = localStorage.getItem(key);
        if (stored === "open") el.open = true;
        else if (stored === "closed") el.open = false;
        // null = no preference, keep the template's default.
      });
    }
    document.addEventListener("toggle", (ev) => {
      const el = ev.target;
      if (!(el instanceof HTMLDetailsElement)) return;
      if (!el.dataset.persistKey) return;
      const key = DETAILS_STORAGE_PREFIX + el.dataset.persistKey;
      localStorage.setItem(key, el.open ? "open" : "closed");
    }, true);

    /* Layered polling: configurable per tab via the inputs at the top
       of the dashboard. Defaults come from STREAM_EVAL_POLL_ACTIVE_MS
       / STREAM_EVAL_POLL_IDLE_MS env vars (5000 / 30000); per-tab
       overrides persist in localStorage. After ~3 min of no change the
       loop pauses; click "refresh now" or change an interval input to
       resume. */
    const PAUSE_AFTER_MS = 3 * 60 * 1000;
    const POLL_STORAGE_ACTIVE = "stream-eval-poll-active-ms";
    const POLL_STORAGE_IDLE = "stream-eval-poll-idle-ms";
    const FLOOR_MS = 100;

    function getPollMs(kind) {
      const stored = localStorage.getItem(
        kind === "active" ? POLL_STORAGE_ACTIVE : POLL_STORAGE_IDLE
      );
      if (stored !== null) {
        const n = parseInt(stored, 10);
        if (!Number.isNaN(n) && n >= FLOOR_MS) return n;
      }
      const attr = kind === "active" ? "pollActiveMs" : "pollIdleMs";
      return parseInt(document.body.dataset[attr], 10) || FLOOR_MS;
    }

    /* Mutex: gate the poll loop while a button-click POST is in
       flight. Without this, a 2-second poll can re-render <main>
       1-2 seconds before the POST response also replaces it,
       producing a brief visual flicker on every click. */
    let inFlightPost = false;

    let lastChange = Date.now();
    let lastHtml = "";
    let timer = null;

    async function refresh() {
      if (inFlightPost) {
        // Skip this tick; we'll be re-scheduled when the POST resolves.
        timer = setTimeout(refresh, getPollMs("active"));
        return;
      }
      try {
        const res = await fetch(window.location.pathname + "?_partial=1");
        const html = await res.text();
        if (html !== lastHtml) {
          document.querySelector("main").innerHTML = html;
          applyPersistedDetails();
          lastHtml = html;
          lastChange = Date.now();
        }
        const isActive = document.querySelector("[data-active='true']") !== null;
        const isPaused = (Date.now() - lastChange) > PAUSE_AFTER_MS;
        const intervalMs = isActive ? getPollMs("active") : getPollMs("idle");
        document.getElementById("poll-status").textContent =
          isPaused ? "paused (no change)"
                   : `polling (${(intervalMs / 1000).toFixed(1)}s)`;
        if (!isPaused) {
          timer = setTimeout(refresh, intervalMs);
        }
      } catch (e) {
        document.getElementById("poll-status").textContent = "error: " + e;
        timer = setTimeout(refresh, getPollMs("idle"));
      }
    }

    document.getElementById("refresh-now").addEventListener("click", () => {
      lastChange = Date.now();
      if (timer) clearTimeout(timer);
      refresh();
    });

    /* Wire the two interval inputs: changes persist to localStorage
       and immediately reschedule the next poll. */
    function bindPollInput(elemId, storageKey) {
      const elem = document.getElementById(elemId);
      const stored = localStorage.getItem(storageKey);
      if (stored !== null) elem.value = stored;
      elem.addEventListener("change", () => {
        const n = parseInt(elem.value, 10);
        if (Number.isNaN(n) || n < FLOOR_MS) return;
        localStorage.setItem(storageKey, String(n));
        lastChange = Date.now();  // also un-pause if we'd auto-paused
        if (timer) clearTimeout(timer);
        refresh();
      });
    }
    bindPollInput("poll-active-input", POLL_STORAGE_ACTIVE);
    bindPollInput("poll-idle-input", POLL_STORAGE_IDLE);

    /* Intercept worker-control form submits. POST to the form's action,
       replace <main> with the response body, and restart the polling
       cycle. As of F.5 every row has its own controls (no global
       controls block), so the selector is simply .row .controls form. */
    document.addEventListener("submit", async (ev) => {
      const form = ev.target;
      if (!form.matches(".row .controls form")) return;
      ev.preventDefault();
      inFlightPost = true;
      try {
        const res = await fetch(form.action, { method: "POST" });
        const html = await res.text();
        document.querySelector("main").innerHTML = html;
        applyPersistedDetails();
        lastHtml = html;
        lastChange = Date.now();
      } catch (e) {
        document.getElementById("poll-status").textContent =
          "control error: " + e;
      } finally {
        inFlightPost = false;
        if (timer) clearTimeout(timer);
        timer = setTimeout(refresh, getPollMs("active"));
      }
    });

    applyPersistedDetails();
    refresh();
  </script>
</body>
</html>
