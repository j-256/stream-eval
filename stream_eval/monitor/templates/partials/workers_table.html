{% if active_workers %}
  <table>
    <thead><tr>
      <th>claude pid</th><th>started</th>
    </tr></thead>
    <tbody>
      {% for w in active_workers %}
      <tr>
        <td>{{ w.pid }}</td>
        <td>{{ w.started_at_human }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p class="empty">No active claude workers.</p>
{% endif %}
