{% if recent %}
  <table>
    <thead><tr>
      <th>fixture</th><th>run</th><th>verdict</th>
    </tr></thead>
    <tbody>
      {% for r in recent %}
      <tr class="{% if r.pass_ %}pass{% else %}fail{% endif %}">
        <td>{{ r.fixture_id }}</td>
        <td>{{ r.run }}</td>
        <td>{{ 'pass' if r.pass_ else 'fail' }}{% if r.contaminated %} (contaminated){% endif %}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p class="empty">No recent completions.</p>
{% endif %}
