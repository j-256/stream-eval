<section class="rows" data-active="{% if state.rows | selectattr('status', 'equalto', 'active') | list %}true{% else %}false{% endif %}">
  {% for row in state.rows %}
    {% include "partials/progress_bar.html" %}
  {% else %}
    <p class="empty">No active or recent runs detected.</p>
  {% endfor %}
</section>
