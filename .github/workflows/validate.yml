name: Validate

on:
  pull_request:
    branches:
      - source
  push:
    branches:
      - source

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install capture browser dependencies
        run: |
          npm ci --prefix tools/cover
          npm exec --prefix tools/cover -- playwright install --with-deps chromium

      - name: Run release checks and capture cover
        run: scripts/release-check
        env:
          COVER_OUTPUT: ${{ runner.temp }}/cover.png

      - name: Retain generated project cover
        if: github.server_url == 'https://github.com'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-cover
          path: ${{ runner.temp }}/cover.png
          if-no-files-found: error
          retention-days: 7

      - name: Retain generated project cover on Enterprise Server
        if: github.server_url != 'https://github.com'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-cover
          path: ${{ runner.temp }}/cover.png
          if-no-files-found: error
          retention-days: 7
